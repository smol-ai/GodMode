<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GodMode</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 40px; background: #f7f9fc; color: #111; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { margin-bottom: 0.5rem; font-size: 3rem; }
    p { font-size: 1.1rem; line-height: 1.7; }
    .buttons { margin-top: 2rem; }
    .btn { display: inline-block; margin: 0.5rem 0.5rem 0 0; padding: 0.85rem 1.4rem; border-radius: 8px; text-decoration: none; color: white; background: #2563eb; }
    .btn.secondary { background: #475569; }
    footer { margin-top: 3rem; color: #475569; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GodMode</h1>
    <p>GodMode is a desktop AI chat browser for ChatGPT, Claude, Bing, Bard, and more.</p>
    <p>This is the static landing page for the GodMode repository.</p>
    <div class="buttons">
      <a href="https://github.com/smol-ai/GodMode" class="btn">View on GitHub</a>
      <a href="https://github.com/smol-ai/GodMode/releases/latest" class="btn secondary">Download Latest Release</a>
    </div>
    <footer>
      <p>Hosted via GitHub Pages from the <code>docs/</code> folder.</p>
    </footer>
  </div>
</body>
</html>
